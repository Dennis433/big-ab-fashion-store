<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - BIG AB Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #111;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            z-index: 200;
            transition: transform 0.3s;
        }

        .sidebar img {
            height: 70px;
            margin-bottom: 30px;
        }

        .sidebar a {
            width: 100%;
            padding: 14px 30px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
        }

        .sidebar a:hover, .sidebar a.active {
            color: #c9a84c;
            background: #1a1a1a;
            border-left: 3px solid #c9a84c;
        }

        .sidebar .logout { color: #ff4444; margin-top: auto; }

        /* TOPBAR */
        .topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #111;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .topbar img { height: 40px; }

        .topbar-hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .topbar-hamburger span {
            width: 24px;
            height: 2px;
            background: #fff;
        }

        /* OVERLAY */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 150;
        }

        .overlay.active { display: block; }

        /* MAIN */
        .main {
            margin-left: 240px;
            padding: 40px;
            max-width: 700px;
        }

        .main h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .main p.subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #c9a84c;
        }

        select option { background: #111; }
        textarea { height: 120px; resize: vertical; }

        .submit-btn {
            padding: 14px 40px;
            background: #c9a84c;
            color: #000;
            border: none;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover { background: #fff; }

        .back-btn {
            display: inline-block;
            margin-top: 16px;
            margin-left: 16px;
            padding: 14px 30px;
            border: 1px solid #555;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .back-btn:hover { border-color: #fff; color: #fff; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .topbar {
                display: flex;
            }

            .main {
                margin-left: 0;
                padding: 20px;
                max-width: 100%;
            }

            .main h1 {
                font-size: 24px;
            }

            .submit-btn {
                width: 100%;
                text-align: center;
            }

            .back-btn {
                width: 100%;
                text-align: center;
                margin-left: 0;
                margin-top: 12px;
                display: block;
            }
        }

        @media (max-width: 480px) {
            input, select, textarea {
                font-size: 13px;
                padding: 12px;
            }

            label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- MOBILE TOPBAR -->
    <div class="topbar">
        <img src="{{ url_for('static', filename='images/BIG_AB.jpg') }}" alt="BIG AB">
        <div class="topbar-hamburger" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <img src="{{ url_for('static', filename='images/BIG_AB.jpg') }}" alt="BIG AB">
        <a href="{{ url_for('admin_dashboard') }}">📦 Products</a>
        <a href="{{ url_for('add_product') }}" class="active">➕ Add Product</a>
        <a href="{{ url_for('home') }}">🏠 View Site</a>
        <a href="{{ url_for('admin_logout') }}" class="logout">🚪 Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        <h1>Add New Product</h1>
        <p class="subtitle">Fill in the details below to add a product</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="e.g. Classic Black Kaftan" required>
            </div>

            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" name="price" placeholder="e.g. 25000" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Jalabiya">Jalabiya</option>
                    <option value="Senators">Senators</option>
                    <option value="Kaftans">Kaftans</option>
                    <option value="Street Wears">Street Wears (Jorts, Hoodie, Jean, Sweat Pants, Cargos)</option>
                    <option value="Owanbe Caps">Owanbe Caps</option>
                    <option value="Hausa Caps">Hausa Caps</option>
                    <option value="2 Piece Male">2 Piece - Male</option>
                    <option value="2 Piece Female">2 Piece - Female</option>
                    <option value="Stone Work & Embellishment">Stone Work & Embellishment</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe the product..."></textarea>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="image" accept="image/*">
            </div>

            <button type="submit" class="submit-btn">Add Product</button>
            <a href="{{ url_for('admin_dashboard') }}" class="back-btn">Back</a>
        </form>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>

</body>
</html>
