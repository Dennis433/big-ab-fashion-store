<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - BIG AB Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .sidebar {
            width: 240px;
            background: #111;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            z-index: 200;
            transition: transform 0.3s;
        }

        .sidebar img {
            height: 70px;
            margin-bottom: 30px;
        }

        .sidebar a {
            width: 100%;
            padding: 14px 30px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
        }

        .sidebar a:hover, .sidebar a.active {
            color: #c9a84c;
            background: #1a1a1a;
            border-left: 3px solid #c9a84c;
        }

        .sidebar .logout { color: #ff4444; margin-top: auto; }

        .topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #111;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .topbar img { height: 40px; }

        .topbar-hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .topbar-hamburger span {
            width: 24px;
            height: 2px;
            background: #fff;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 150;
        }

        .overlay.active { display: block; }

        .main {
            margin-left: 240px;
            padding: 40px;
            max-width: 700px;
        }

        .main h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .main p.subtitle {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #c9a84c;
        }

        select option { background: #111; }
        textarea { height: 120px; resize: vertical; }

        /* IMAGE UPLOAD */
        .image-upload-area {
            border: 2px dashed #333;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border 0.3s;
            position: relative;
        }

        .image-upload-area:hover {
            border-color: #c9a84c;
        }

        .image-upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .image-upload-area p {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .image-upload-area span {
            color: #c9a84c;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-top: 8px;
        }

        /* IMAGE PREVIEWS */
        .image-previews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .preview-item {
            position: relative;
            height: 100px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ff4444;
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .hint {
            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .submit-btn {
            padding: 14px 40px;
            background: #c9a84c;
            color: #000;
            border: none;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover { background: #fff; }

        .back-btn {
            display: inline-block;
            margin-top: 16px;
            margin-left: 16px;
            padding: 14px 30px;
            border: 1px solid #555;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .back-btn:hover { border-color: #fff; color: #fff; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .topbar { display: flex; }
            .main { margin-left: 0; padding: 20px; max-width: 100%; }
            .main h1 { font-size: 24px; }
            .submit-btn { width: 100%; text-align: center; }
            .back-btn { width: 100%; text-align: center; margin-left: 0; margin-top: 12px; display: block; }
        }

        @media (max-width: 480px) {
            input, select, textarea { font-size: 13px; padding: 12px; }
            label { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <img src="{{ url_for('static', filename='images/BIG_AB.jpg') }}" alt="BIG AB">
        <div class="topbar-hamburger" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <img src="{{ url_for('static', filename='images/BIG_AB.jpg') }}" alt="BIG AB">
        <a href="{{ url_for('admin_dashboard') }}">📦 Products</a>
        <a href="{{ url_for('add_product') }}" class="active">➕ Add Product</a>
        <a href="{{ url_for('home') }}">🏠 View Site</a>
        <a href="{{ url_for('admin_logout') }}" class="logout">🚪 Logout</a>
    </div>

    <div class="main">
        <h1>Add New Product</h1>
        <p class="subtitle">Fill in the details below to add a product</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="e.g. Classic Black Kaftan" required>
            </div>

            <div class="form-group">
                <label>Price (₦)</label>
                <input type="number" name="price" placeholder="e.g. 25000" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Jalabiya">Jalabiya</option>
                    <option value="Senators">Senators</option>
                    <option value="Kaftans">Kaftans</option>
                    <option value="Street Wears">Street Wears (Jorts, Hoodie, Jean, Sweat Pants, Cargos)</option>
                    <option value="Owanbe Caps">Owanbe Caps</option>
                    <option value="Hausa Caps">Hausa Caps</option>
                    <option value="2 Piece Male">2 Piece - Male</option>
                    <option value="2 Piece Female">2 Piece - Female</option>
                    <option value="Stone Work & Embellishment">Stone Work & Embellishment</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe the product..."></textarea>
            </div>

            <div class="form-group">
                <label>Product Images</label>
                <div class="image-upload-area" id="uploadArea">
                    <input type="file" name="images" id="imageInput" accept="image/*" multiple>
                    <p>📷 Click or drag to upload images</p>
                    <span>Select multiple images</span>
                </div>
                <p class="hint">You can upload up to 5 images per product</p>
                <div class="image-previews" id="imagePreviews"></div>
            </div>

            <button type="submit" class="submit-btn">Add Product</button>
            <a href="{{ url_for('admin_dashboard') }}" class="back-btn">Back</a>
        </form>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        const imageInput = document.getElementById('imageInput');
        const imagePreviews = document.getElementById('imagePreviews');
        let selectedFiles = [];

        imageInput.addEventListener('change', function () {
            const newFiles = Array.from(this.files);
            selectedFiles = [...selectedFiles, ...newFiles].slice(0, 5);
            renderPreviews();
            updateFileInput();
        });

        function renderPreviews() {
            imagePreviews.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const item = document.createElement('div');
                    item.className = 'preview-item';
                    item.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <button type="button" class="remove" onclick="removeImage(${index})">×</button>
                    `;
                    imagePreviews.appendChild(item);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
            updateFileInput();
        }

        function updateFileInput() {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => dataTransfer.items.add(file));
            imageInput.files = dataTransfer.files;
        }
    </script>

</body>
</html>
