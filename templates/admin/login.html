<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BIG AB Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-box {
            background: #111;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #c9a84c;
        }

        .login-box img {
            height: 80px;
            margin-bottom: 20px;
        }

        .login-box h2 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .flash {
            background: #c9a84c;
            color: #000;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            background: #222;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        input:focus {
            outline: none;
            border-color: #c9a84c;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #c9a84c;
            color: #000;
            border: none;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='images/BIG_AB.jpg') }}" alt="BIG AB Fashion">
        <h2>Admin Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
